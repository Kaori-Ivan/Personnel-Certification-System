<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>人員認證管理系統</title><link rel="icon" type="image/svg+xml" href="assets/certification-icon.svg"><link rel="stylesheet" href="css/question-bank.css"></head><body><div id="view-root"></div><template id="view-question-bank" data-title="題庫｜人員認證管理系統" data-class="">
    <main class="question-bank-page">
      <header class="page-header">
        <button type="button" aria-label="開啟選單">☰</button>
        <h1>題庫</h1>
      </header>

      <section class="question-bank-intro" aria-labelledby="question-bank-title">
        <h2 id="question-bank-title">題庫</h2>
        <p>選擇認證項目，開始練習題目</p>
      </section>

      <form class="question-bank-filter" role="search">
        <label for="question-search">搜尋認證名稱</label>
        <input
          id="question-search"
          name="question-search"
          type="search"
          placeholder="搜尋認證名稱"
        >

        <label for="question-category">認證類別</label>
        <select id="question-category" name="question-category">
          <option value="all">全部類別</option>
          <option value="occupational-safety">職業安全</option>
          <option value="health">衛生保健</option>
          <option value="maritime-safety">海事安全</option>
        </select>
      </form>

      <section class="question-list" aria-label="題庫項目">
        <a class="question-card" data-category="occupational-safety" href="#">
          <h2>天車操作證照</h2>
          <span>職業安全</span>
          <p>共 120 題</p>
        </a>

        <a class="question-card" data-category="health" href="#">
          <h2>急救人員認證</h2>
          <span>衛生保健</span>
          <p>共 80 題</p>
        </a>

        <a class="question-card" data-category="occupational-safety" href="#">
          <h2>消防安全證照</h2>
          <span>職業安全</span>
          <p>共 100 題</p>
        </a>

        <a class="question-card" data-category="occupational-safety" href="#">
          <h2>高壓電氣操作證照</h2>
          <span>職業安全</span>
          <p>共 150 題</p>
        </a>

        <a class="question-card" data-category="maritime-safety" href="#">
          <h2>船舶基本安全訓練</h2>
          <span>海事安全</span>
          <p>共 90 題</p>
        </a>
      </section>

      <aside class="question-reminder">
        <h2>小提醒</h2>
        <p>題庫僅供練習使用，實際認證題目將由系統隨機抽題。</p>
      </aside>
    </main>

    <nav class="bottom-nav" aria-label="主要導覽">
      <a href="user.html?view=home">首頁</a>
      <a href="user.html?view=my-certifications">認證</a>
      <a href="question-bank.html" aria-current="page">題庫</a>
    </nav>
  </template><script>(function(){const allowed=["question-bank"],fallback="question-bank";const q=new URLSearchParams(location.search),v=allowed.includes(q.get('view'))?q.get('view'):fallback,t=document.querySelector('#view-'+v),root=document.querySelector('#view-root');document.body.dataset.view=v;document.body.className=t.dataset.class||'';document.title=t.dataset.title;root.replaceWith(t.content.cloneNode(true));})();</script><script src="js/auth.js"></script><script src="js/question-bank.js"></script></body></html>
