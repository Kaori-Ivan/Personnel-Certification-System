<!doctype html>
<html lang="zh-Hant">
  <head>
    <script src="../js/core/auth.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="管理人員資料與認證狀態">
    <title>人員管理｜人員認證管理系統</title>
    <link rel="stylesheet" href="../css/pages/admin-personnel.css">
  </head>

  <body>
    <aside class="admin-sidebar">
      <header>
        <strong>人員認證管理系統</strong>
        <span>管理者後台</span>
      </header>
      <nav aria-label="管理後台選單">
        <a href="admin-dashboard.html">首頁</a>
        <a href="admin-personnel.html" aria-current="page">人員管理</a>
        <a href="admin-certifications.html">認證項目管理</a>
        <a href="admin-review.html">審核中心</a>
        
      </nav>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <div>
          <h1>人員管理</h1>
          <p>管理人員基本資料與認證狀態</p>
        </div>
        <button type="button">通知（2）</button>
        <button type="button" data-logout>登出</button>
      </header>

      <form class="personnel-filter" role="search">
        <label>
          搜尋人員
          <input type="search" placeholder="搜尋姓名、工號、部門">
        </label>
        <label>
          部門
          <select>
            <option value="all">全部</option>
            <option value="machine">機械課</option>
            <option value="welding">電焊課</option>
            <option value="safety">安環課</option>
          </select>
        </label>
        <label>
          在職狀態
          <select>
            <option value="all">全部</option>
            <option value="active">在職</option>
            <option value="inactive">離職</option>
          </select>
        </label>
        <label>
          認證狀態
          <select>
            <option value="all">全部</option>
            <option value="certified">已認證</option>
            <option value="in-progress">進行中</option>
            <option value="pending">待審核</option>
          </select>
        </label>
        <button type="button">匯出清單</button>
        <button type="button">新增人員</button>
      </form>

      <section class="personnel-list" aria-labelledby="personnel-title">
        <h2 id="personnel-title">人員清單（共 36 人）</h2>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th scope="col">姓名</th>
                <th scope="col">工號</th>
                <th scope="col">部門</th>
                <th scope="col">在職狀態</th>
                <th scope="col">已認證</th>
                <th scope="col">進行中</th>
                <th scope="col">待審核</th>
                <th scope="col">每月加給</th>
                <th scope="col">操作</th>
              </tr>
            </thead>
            <tbody>
              <tr><td>王小明</td><td>E2025001</td><td>機械課</td><td>在職</td><td>6</td><td>1</td><td>1</td><td>NT$ 3,000</td><td><a href="admin-personnel-detail.html">查看詳情</a></td></tr>
              <tr><td>李大華</td><td>E2025002</td><td>機械課</td><td>在職</td><td>5</td><td>1</td><td>0</td><td>NT$ 2,500</td><td><a href="admin-personnel-detail.html">查看詳情</a></td></tr>
              <tr><td>張志強</td><td>E2025003</td><td>電焊課</td><td>在職</td><td>4</td><td>0</td><td>1</td><td>NT$ 2,000</td><td><a href="admin-personnel-detail.html">查看詳情</a></td></tr>
              <tr><td>陳小美</td><td>E2025004</td><td>安環課</td><td>在職</td><td>3</td><td>2</td><td>0</td><td>NT$ 1,600</td><td><a href="admin-personnel-detail.html">查看詳情</a></td></tr>
              <tr><td>林志遠</td><td>E2025005</td><td>天車課</td><td>在職</td><td>2</td><td>1</td><td>0</td><td>NT$ 1,000</td><td><a href="admin-personnel-detail.html">查看詳情</a></td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
