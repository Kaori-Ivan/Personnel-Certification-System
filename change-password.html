<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首次設定密碼｜人員認證管理系統</title>
    <script src="../js/core/auth.js"></script>
    <link rel="stylesheet" href="../css/pages/login.css">
    <link rel="stylesheet" href="../css/pages/change-password.css">
    <script src="../js/pages/change-password.js" defer></script>
  </head>
  <body>
    <main class="change-page">
      <section class="login-panel" aria-labelledby="change-title">
        <header class="login-panel__header">
          <p class="step-label">首次登入 · 設定個人密碼</p>
          <h1 id="change-title">設定您的新密碼</h1>
          <p>完成密碼設定後，即可進入系統。</p>
        </header>
        <p class="employee-label">人員工號：<strong id="employee-id"></strong></p>
        <form class="login-form" id="change-password-form" novalidate>
          <div class="password-field">
            <label for="new-password">新密碼</label>
            <div class="form-field__control">
              <input id="new-password" type="password" autocomplete="new-password" required minlength="8" aria-describedby="password-rules" autofocus>
              <button class="password-toggle" type="button" data-toggle="new-password" aria-controls="new-password" aria-label="顯示新密碼" aria-pressed="false"><span aria-hidden="true"></span></button>
            </div>
          </div>
          <ul class="password-rules" id="password-rules">
            <li>至少 8 碼</li>
            <li>同時包含英文字母與數字</li>
            <li>不可與工號（預設密碼）相同</li>
          </ul>
          <div class="password-field">
            <label for="confirm-password">確認新密碼</label>
            <div class="form-field__control">
              <input id="confirm-password" type="password" autocomplete="new-password" required>
              <button class="password-toggle" type="button" data-toggle="confirm-password" aria-controls="confirm-password" aria-label="顯示確認密碼" aria-pressed="false"><span aria-hidden="true"></span></button>
            </div>
          </div>
          <p class="login-form__message" id="change-message" role="status" aria-live="polite"></p>
          <button class="login-form__submit" type="submit">儲存密碼並進入系統</button>
          <button class="back-login" type="button" data-logout>登出並返回登入頁</button>
        </form>
        <p class="demo-notice">前端測試模式：請使用測試密碼。設定僅保留於目前分頁，尚未連接公司帳號。</p>
      </section>
    </main>
  </body>
</html>
