<!doctype html>
<html lang="zh-Hant">
  <head>
    <script src="../js/core/auth.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="查看進行中的人員認證流程">
    <title>進行中認證｜人員認證管理系統</title>
    <link rel="stylesheet" href="../css/pages/in-progress.css">
      <script>document.addEventListener("DOMContentLoaded", () => { const state = Auth.read(); if (state.signedIn && !state.mustChange) location.replace("my-certifications.html?status=in-progress"); });</script>
  </head>

  <body>
    <main class="progress-page">
      <header class="page-header">
        <button type="button" aria-label="開啟選單">☰</button>
        <h1>我的認證</h1>
        <button type="button" aria-label="查看通知">通知</button>
      </header>

      <nav class="status-tabs" aria-label="認證狀態">
        <a href="my-certifications.html">已認證</a>
        <a href="in-progress.html" aria-current="page">進行中</a>
        <a href="pending-review.html">待審核</a>
      </nav>

      <p class="page-notice">進行中的認證項目會依流程狀態更新</p>

      <section class="progress-list" aria-label="進行中的認證項目">
        <article class="progress-card">
          <header>
            <div>
              <h2>天車操作認證</h2>
              <span>進行中</span>
              <p>認證編號：CR-2024-0158</p>
              <p>開啟日期：2024/05/20</p>
            </div>
            <button type="button">取消認證</button>
          </header>

          <ol class="progress-steps">
            <li data-state="complete">管理者開啟</li>
            <li data-state="complete">學科考核</li>
            <li data-state="current">術科考核</li>
            <li data-state="waiting">管理者審核</li>
          </ol>

          <footer>
            <p><strong>術科驗證組長：</strong>王組長</p>
            <p><strong>所屬單位：</strong>機械組</p>
            <button type="button">查看紀錄</button>
          </footer>
        </article>

        <article class="progress-card">
          <header>
            <div>
              <h2>堆高機操作認證</h2>
              <span>進行中</span>
              <p>認證編號：FL-2024-0087</p>
              <p>開啟日期：2024/05/18</p>
            </div>
            <button type="button">取消認證</button>
          </header>

          <ol class="progress-steps">
            <li data-state="complete">管理者開啟</li>
            <li data-state="complete">學科考核</li>
            <li data-state="current">術科考核</li>
            <li data-state="waiting">管理者審核</li>
          </ol>

          <footer>
            <p><strong>術科驗證組長：</strong>李組長</p>
            <p><strong>所屬單位：</strong>物流組</p>
            <button type="button">查看紀錄</button>
          </footer>
        </article>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="主要導覽">
      <a href="home.html">首頁</a>
      <a href="my-certifications.html" aria-current="page">認證</a>
      <a href="question-bank.html">題庫</a>
    </nav>
  </body>
</html>
