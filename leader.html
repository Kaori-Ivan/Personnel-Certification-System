<template id="view-leader-assessment-form" data-title="術科考核評分｜人員認證管理系統" data-class="">
    <main class="assessment-form-page">
      <header class="page-header">
        <a href="leader.html?view=leader-assessment" aria-label="返回考核清單">‹</a>
        <h1>術科考核</h1>
      </header>

      <section class="employee-summary" aria-labelledby="employee-name">
        <div>
          <h2 id="employee-name">李大華</h2>
          <span>在職</span>
        </div>
        <dl>
          <div><dt>工號</dt><dd>E2025002</dd></div>
          <div><dt>部門</dt><dd>機械課</dd></div>
          <div><dt>職稱</dt><dd>堆高機操作人員</dd></div>
          <div><dt>到職日</dt><dd>2023/03/15</dd></div>
        </dl>
      </section>

      <form
        class="assessment-form"
        id="assessment-form"
        action="leader.html?view=leader-assessment-evaluation"
        method="get"
      >
        <section aria-labelledby="score-title">
          <h2 id="score-title">術科測驗項目</h2>

          <div class="score-table">
            <div class="score-row score-row--header" aria-hidden="true">
              <span>測驗項目</span>
              <span>配分</span>
              <span>得分</span>
            </div>

            <label class="score-row">
              <span>1. 作業前檢查</span>
              <span>20</span>
              <input type="number" name="pre-check" min="0" max="20" value="18" required>
            </label>

            <label class="score-row">
              <span>2. 操作程序</span>
              <span>30</span>
              <input type="number" name="operation" min="0" max="30" value="28" required>
            </label>

            <label class="score-row">
              <span>3. 安全防護</span>
              <span>20</span>
              <input type="number" name="safety" min="0" max="20" value="19" required>
            </label>

            <label class="score-row">
              <span>4. 異常處理</span>
              <span>20</span>
              <input type="number" name="exception" min="0" max="20" value="17" required>
            </label>

            <label class="score-row">
              <span>5. 作業後檢整</span>
              <span>10</span>
              <input type="number" name="final-check" min="0" max="10" value="9" required>
            </label>

            <div class="score-total">
              <strong>總分</strong>
              <output id="total-score">91</output>
            </div>
          </div>
        </section>

        <label class="assessment-note">
          備註（選填）
          <textarea name="note" maxlength="200" rows="4" placeholder="可輸入其他補充說明"></textarea>
        </label>

        <div class="form-actions">
          <button type="button">暫存</button>
          <button type="submit">下一步：考核評估</button>
        </div>
      </form>
    </main>

<template id="view-leader-assessment-evaluation" data-title="考核評估｜人員認證管理系統" data-class="">
    <main class="evaluation-page">
      <header class="page-header">
        <a href="leader.html?view=leader-assessment-form" aria-label="返回術科評分">‹</a>
        <h1>考核評估</h1>
      </header>

      <section class="employee-summary" aria-labelledby="employee-name">
        <div>
          <h2 id="employee-name">李大華</h2>
          <span>在職</span>
        </div>
        <p>工號：E2025002</p>
        <p>部門：機械課</p>
        <p>職稱：堆高機操作人員</p>
      </section>

      <form class="evaluation-form" id="evaluation-form">
        <fieldset>
          <legend>考核評估</legend>

          <label>
            工作態度
            <select name="work-attitude" required>
              <option value="5">5 星－優秀</option>
              <option value="4" selected>4 星－良好</option>
              <option value="3">3 星－普通</option>
              <option value="2">2 星－待加強</option>
              <option value="1">1 星－不佳</option>
            </select>
          </label>

          <label>
            學習能力
            <select name="learning-ability" required>
              <option value="5" selected>5 星－優秀</option>
              <option value="4">4 星－良好</option>
              <option value="3">3 星－普通</option>
              <option value="2">2 星－待加強</option>
              <option value="1">1 星－不佳</option>
            </select>
          </label>

          <label>
            安全意識
            <select name="safety-awareness" required>
              <option value="5">5 星－優秀</option>
              <option value="4" selected>4 星－良好</option>
              <option value="3">3 星－普通</option>
              <option value="2">2 星－待加強</option>
              <option value="1">1 星－不佳</option>
            </select>
          </label>

          <label>
            團隊合作
            <select name="teamwork" required>
              <option value="5">5 星－優秀</option>
              <option value="4" selected>4 星－良好</option>
              <option value="3">3 星－普通</option>
              <option value="2">2 星－待加強</option>
              <option value="1">1 星－不佳</option>
            </select>
          </label>
        </fieldset>

        <label class="result-field">
          整體評核結果
          <select name="result" required>
            <option value="pass" selected>通過</option>
            <option value="fail">不通過</option>
          </select>
        </label>

        <label class="comment-field">
          建議與提醒（選填）
          <textarea name="comment" maxlength="200" rows="4" placeholder="請填寫考核建議"></textarea>
        </label>

        <div class="form-actions">
          <a href="leader.html?view=leader-assessment-form">上一步</a>
          <button type="submit">送出考核結果</button>
        </div>
      </form>
    </main>

    <nav class="bottom-nav" aria-label="主要導覽">
      <a href="user.html?view=home">首頁</a>
      <a href="user.html?view=my-certifications">認證</a>
      <a href="question-bank.html">題庫</a>
    </nav>
