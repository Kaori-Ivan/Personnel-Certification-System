<!doctype html>
<html lang="zh-Hant">
  <head>
    <script src="../js/core/auth.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="查看等待審核的認證項目">
    <title>待審核｜人員認證管理系統</title>
    <link rel="stylesheet" href="../css/pages/pending-review.css">
      <script>document.addEventListener("DOMContentLoaded", () => { const state = Auth.read(); if (state.signedIn && !state.mustChange) location.replace("my-certifications.html?status=pending"); });</script>
  </head>

  <body>
    <main class="pending-page">
      <header class="page-header">
        <button type="button" aria-label="開啟選單">☰</button>
        <h1>認證</h1>
        <button type="button" aria-label="查看通知">通知（1）</button>
      </header>

      <nav class="status-tabs" aria-label="認證狀態">
        <a href="my-certifications.html">已認證 8</a>
        <a href="in-progress.html">進行中 2</a>
        <a href="pending-review.html" aria-current="page">待審核 2</a>
      </nav>

      <section class="pending-list" aria-labelledby="pending-title">
        <h2 id="pending-title">待審核的認證</h2>

        <article class="pending-card">
          <header>
            <h3>天車操作證照</h3>
            <span>待審核</span>
          </header>
          <p><strong>提交時間</strong></p>
          <time datetime="2026-05-12T14:30">2026/05/12 14:30</time>
        </article>

        <article class="pending-card">
          <header>
            <h3>急救人員認證</h3>
            <span>待審核</span>
          </header>
          <p><strong>提交時間</strong></p>
          <time datetime="2026-05-08T09:15">2026/05/08 09:15</time>
        </article>
      </section>

      <aside class="review-reminder">
        <h2>小提醒</h2>
        <p>審核結果將以訊息通知，請留意通知與信箱。</p>
      </aside>
    </main>

    <nav class="bottom-nav" aria-label="主要導覽">
      <a href="home.html">首頁</a>
      <a href="my-certifications.html" aria-current="page">認證</a>
      <a href="question-bank.html">題庫</a>
    </nav>
  </body>
</html>
