<!doctype html>
<html lang="zh-Hant">
  <head>
    <script src="../js/core/auth.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="查看個人的認證項目與目前進度">
    <title>我的認證｜人員認證管理系統</title>
    <link rel="stylesheet" href="../css/pages/my-certifications.css">
    <script src="../js/core/certification-demo.js" defer></script>
    <script src="../js/pages/my-certifications.js" defer></script>
  </head>

  <body>
    <main class="certifications-page">
      <header class="page-header">
        <a href="home.html" aria-label="返回首頁">‹</a>
        <h1>我的認證</h1>
        <button type="button" aria-label="搜尋認證">搜尋</button>
      </header>

      <nav class="status-tabs" aria-label="認證狀態">
        <button type="button" data-status="certified" aria-selected="true">已認證（8）</button>
        <button type="button" data-status="in-progress" aria-selected="false">進行中（2）</button>
        <button type="button" data-status="pending" aria-selected="false">待審核（1）</button>
      </nav>

      <section class="certification-list" aria-label="認證清單">
        <article class="certification-card" data-status="certified">
          <h2>天車操作證照</h2>
          <span>已認證</span>
          <p>認證日期：2024/05/20</p>
          <p>永久有效</p>
          <strong>+300 元／月</strong>
        </article>

        <article class="certification-card" data-status="certified">
          <h2>救生艇操作</h2>
          <span>已認證</span>
          <p>認證日期：2024/04/18</p>
          <p>永久有效</p>
          <strong>+300 元／月</strong>
        </article>

        <article class="certification-card" data-status="certified">
          <h2>防火訓練</h2>
          <span>已認證</span>
          <p>認證日期：2024/03/10</p>
          <p>永久有效</p>
          <strong>+200 元／月</strong>
        </article>

        <article class="certification-card" data-status="pending" data-id="ecdis-001" hidden>
          <h2>ECDIS 操作</h2>
          <span>待審核</span>
          <p>申請日期：2024/05/18</p>
          <p>審核中</p>
          <strong>+500 元／月</strong>
          <a class="detail-link" href="certification-detail.html?id=ecdis-001">查看詳情與進度 →</a>
        </article>

        <article class="certification-card" data-status="in-progress" data-id="cnc-001" hidden>
          <h2>CNC 車床操作</h2>
          <span>進行中</span>
          <p>申請日期：2024/05/15</p>
          <p>資料審核中</p>
          <strong>+300 元／月</strong>
          <a class="detail-link" href="certification-detail.html?id=cnc-001">查看詳情與進度 →</a>
        </article>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="主要導覽">
      <a href="home.html">首頁</a>
      <a href="my-certifications.html" aria-current="page">認證</a>
      <a href="question-bank.html">題庫</a>
    </nav>
  </body>
</html>
