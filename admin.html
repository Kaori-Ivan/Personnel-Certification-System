<template id="view-admin-personnel" data-title="人員管理｜人員認證管理系統" data-class="">
    <aside class="admin-sidebar">
      <header>
        <strong>人員認證管理系統</strong>
        <span>管理者後台</span>
      </header>
      <nav aria-label="管理後台選單">
        <a href="admin.html?view=admin-dashboard">首頁</a>
        <a href="admin.html?view=admin-personnel" aria-current="page">人員管理</a>
        <a href="admin.html?view=admin-certifications">認證項目管理</a>
        <a href="admin.html?view=admin-review">審核中心</a>
      </nav>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <div>
          <h1>人員管理</h1>
          <p>管理人員基本資料與認證狀態</p>
        </div>
        <button type="button" data-logout>登出</button>
      </header>

      <form class="personnel-filter" id="personnel-filter" role="search">
        <label>
          搜尋人員
          <input id="personnel-search" type="search" placeholder="搜尋姓名、工號、部門">
        </label>
        <label>
          部門
          <select id="department-filter">
            <option value="all">全部</option>
            <option value="machine">機械課</option>
            <option value="welding">電焊課</option>
            <option value="safety">安環課</option>
          </select>
        </label>
        <label>
          在職狀態
          <select id="employment-filter">
            <option value="all">全部</option>
            <option value="active">在職</option>
            <option value="inactive">離職</option>
          </select>
        </label>
        <label>
          認證狀態
          <select id="certification-filter">
            <option value="all">全部</option>
            <option value="certified">已認證</option>
            <option value="in-progress">進行中</option>
            <option value="pending">待審核</option>
          </select>
        </label>
        <button class="export-button" id="export-personnel" type="button">匯出清單</button>
        <button class="add-person-button" id="add-person" type="button">新增人員</button>
      </form>

      <section class="personnel-list" aria-labelledby="personnel-title">
        <h2 id="personnel-title">人員清單</h2>
        <p id="personnel-count" class="result-count" aria-live="polite"></p>
        <p id="empty-personnel" class="empty-message" hidden>找不到符合條件的人員。</p>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th scope="col">姓名</th>
                <th scope="col">工號</th>
                <th scope="col">部門</th>
                <th scope="col">在職狀態</th>
                <th scope="col">已認證</th>
                <th scope="col">進行中</th>
                <th scope="col">待審核</th>
                <th scope="col">每月加給</th>
                <th scope="col">操作</th>
              </tr>
            </thead>
            <tbody id="personnel-table-body"></tbody>
          </table>
        </div>
      </section>

      <dialog id="person-dialog">
        <form id="person-form" method="dialog" novalidate>
          <h2>新增人員</h2>
          <label>工號<input id="new-employee-id" maxlength="20" autocomplete="off" required placeholder="例如：E2025006"></label>
          <label>姓名<input id="new-employee-name" maxlength="30" autocomplete="off" required placeholder="請輸入姓名"></label>
          <label>部門<select id="new-department" required><option value="">請選擇部門</option><option>機械課</option><option>電焊課</option><option>安環課</option><option>天車課</option><option>其他</option></select></label>
          <label>在職狀態<select id="new-employment"><option value="active">在職</option><option value="inactive">離職</option></select></label>
          <p id="person-form-error" class="form-error" aria-live="polite"></p>
          <div class="dialog-actions"><button value="cancel" type="submit">取消</button><button id="save-person" value="default" type="submit">新增人員</button></div>
        </form>
      </dialog>
    </main>
  </template>

    <aside class="admin-sidebar">
      <header><strong>人員認證管理系統</strong><span>管理者後台</span></header>
      <nav aria-label="管理後台選單">
        <a href="admin.html?view=admin-dashboard">首頁</a>
        <a href="admin.html?view=admin-personnel">人員管理</a>
        <a href="admin.html?view=admin-certifications" aria-current="page">認證項目管理</a>
        <a href="admin.html?view=admin-review">審核中心</a>

    </aside>
    <main class="admin-main">

        <div><h1>認證項目管理</h1><p>查看全部認證項目與已停產項目</p></div>

          <button id="reset-certifications" class="secondary-action" type="button">重新整理</button>

              <tr data-status="active"><td>天車操作認證</td><td>機械操作</td><td>2 年</td><td>NT$ 500</td><td><span class="status active">啟用中</span></td><td>18</td><td><button type="button" class="detail-button">編輯</button></td></tr>
              <tr data-status="active"><td>堆高機操作認證</td><td>機械操作</td><td>2 年</td><td>NT$ 500</td><td><span class="status active">啟用中</span></td><td>22</td><td><button type="button" class="detail-button">編輯</button></td></tr>
              <tr data-status="active"><td>急救人員認證</td><td>安全衛生</td><td>3 年</td><td>NT$ 300</td><td><span class="status active">啟用中</span></td><td>27</td><td><button type="button" class="detail-button">編輯</button></td></tr>
              <tr data-status="active"><td>高空作業認證</td><td>安全衛生</td><td>2 年</td><td>NT$ 600</td><td><span class="status active">啟用中</span></td><td>24</td><td><button type="button" class="detail-button">編輯</button></td></tr>
              <tr data-status="discontinued"><td>舊式鋼爐操作認證</td><td>機械操作</td><td>2 年</td><td>NT$ 400</td><td><span class="status discontinued">已停產</span></td><td>6</td><td><button type="button" class="detail-button">編輯</button></td></tr>
              <tr data-status="discontinued"><td>輻射作業認證</td><td>特殊作業</td><td>2 年</td><td>NT$ 800</td><td><span class="status discontinued">已停產</span></td><td>3</td><td><button type="button" class="detail-button">編輯</button></td></tr>

        </div>
